name: live-update

# 夏の地方大会期間(6〜8月)に毎朝1回、速報データを取り込んで再ビルド・デプロイする
on:
  schedule:
    - cron: "0 21 * 6-8 *"   # 21:00 UTC = 06:00 JST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 速報データ取り込み
        run: python tools/live_update.py
      - name: サイト再生成
        run: python build.py
      - name: 変更があればコミット・プッシュ(pushでCloudflareが自動デプロイ)
        run: |
          git config user.name "live-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "速報データ自動更新 $(TZ=Asia/Tokyo date +%F)"
          git push
