name: live-update

# 大会期間(3-4月=選抜、6-8月=選手権)に1日4回、速報データを取り込んで再ビルド・デプロイする
on:
  schedule:
    - cron: "0 3,7,12,21 * 3,4,6-8 *"   # UTC 3,7,12,21時 = JST 12:00,16:00,21:00,翌06:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 速報データ取り込み
        run: python tools/live_update.py
      - name: 甲子園の試合日程を更新
        run: python tools/koshien_schedule.py
      - name: サイト再生成
        run: python build.py
      - name: 変更があればコミット・プッシュ(pushでCloudflareが自動デプロイ)
        run: |
          git config user.name "live-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "速報データ自動更新 $(TZ=Asia/Tokyo date +%F)"
          git push
